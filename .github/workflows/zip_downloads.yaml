name: Zip Downloads Folder

# Trigger when there's a push to any branch starting with ht for changes in downloads/
on:
  push:
    branches:
      - 'ht*'
    paths:
      - 'downloads/**'  # Watch for changes in the downloads folder

jobs:
  zip-folder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Zip downloads folder
      run: |
        zip -r downloads.zip downloads

    - name: Commit and push downloads.zip
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add downloads.zip
        # [skip ci] prevents the action from triggering itself repeatedly
        git diff-index --quiet HEAD || git commit -m "Auto update downloads.zip [skip ci]"
        # Pushes dynamically to whichever ht* branch triggered the run
        git push origin ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
